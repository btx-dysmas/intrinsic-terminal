name: Refresh universe snapshot

on:
  schedule:
    - cron: "30 22 * * 1-5" # after the U.S. close, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run universe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.json
          git diff --cached --quiet || (git commit -m "Refresh universe snapshot" && git push)
